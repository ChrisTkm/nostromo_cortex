<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Cortex command deck banner</title>
  <desc id="desc">Minimal dark banner for Cortex with command deck layout, graph visualization and terminal aesthetics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0d"/>
      <stop offset="1" stop-color="#11100c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c96d" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#f2c96d" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#5fd0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5fd0ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c96d"/>
      <stop offset="0.6" stop-color="#f2c96d"/>
      <stop offset="0.8" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#5fd0ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="0" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1600" height="1" fill="#f2c96d" opacity="0.3"/>

  <!-- ===== LEFT IDENTITY ===== -->
  <g transform="translate(100 110)">
    <!-- /// CORTEX -->
    <text x="0" y="82" fill="#f2c96d" font-family="Cascadia Mono, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="2">/// CORTEX</text>
    <text x="2" y="112" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="13" letter-spacing="2">LOCAL-FIRST KNOWLEDGE COCKPIT</text>
    <text x="0" y="148" fill="#696969" font-family="Cascadia Mono, Consolas, monospace" font-size="11" letter-spacing="1">8 modules · MCP server · AI skills</text>
  </g>

  <!-- ===== COMMAND DECK ===== -->
  <g transform="translate(540 85)">
    <rect x="0" y="0" width="960" height="300" rx="14" fill="#151515" stroke="#2b2a25" stroke-width="1.2"/>

    <!-- Toolbar -->
    <rect x="0" y="0" width="960" height="42" rx="14" fill="#1c1b18"/>
    <rect x="0" y="34" width="960" height="10" fill="#1c1b18"/>
    <path d="M0 42h960" stroke="#2f2b22" stroke-width="0.8"/>

    <circle cx="22" cy="21" r="3.5" fill="#f2c96d" opacity="0.9"/>
    <circle cx="38" cy="21" r="3.5" fill="#787466" opacity="0.7"/>
    <circle cx="54" cy="21" r="3.5" fill="#5fd0ff" opacity="0.55"/>
    <text x="80" y="26" fill="#d7d0ba" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">GRAPH · PLANS · NOTES · LOGS · BRAIN · MCP</text>
    <text x="870" y="26" fill="#f2c96d" font-family="Cascadia Mono, Consolas, monospace" font-size="11" opacity="0.85">Actualizar ▸</text>

    <!-- Sidebar skeleton -->
    <g transform="translate(20 62)">
      <rect x="0" y="0" width="180" height="16" rx="4" fill="#2b291f"/>
      <rect x="0" y="28" width="128" height="8" rx="3" fill="#3a372b"/>
      <rect x="0" y="46" width="150" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="64" width="114" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="82" width="140" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="100" width="96" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="118" width="132" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="136" width="106" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="154" width="124" height="8" rx="3" fill="#2d2d2d"/>
      <rect x="0" y="172" width="88" height="8" rx="3" fill="#2d2d2d"/>
    </g>

    <!-- Divider -->
    <line x1="220" y1="62" x2="220" y2="280" stroke="#262626" stroke-width="0.8"/>

    <!-- Graph area -->
    <g transform="translate(240 62)">
      <path d="M50 80 C 120 20, 190 20, 260 80 S 380 140, 480 80"
            fill="none" stroke="url(#line)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M260 80 C 330 140, 400 140, 480 80"
            fill="none" stroke="url(#line)" stroke-width="1" stroke-linecap="round" opacity="0.45"/>

      <!-- Nodes -->
      <g filter="url(#glow)">
        <circle cx="50" cy="80" r="6" fill="#f2c96d"/>
        <circle cx="260" cy="80" r="6" fill="#f2c96d"/>
        <circle cx="480" cy="80" r="6" fill="#5fd0ff"/>
      </g>
      <circle cx="155" cy="42" r="3.5" fill="#f2c96d" opacity="0.5"/>
      <circle cx="380" cy="130" r="3.5" fill="#5fd0ff" opacity="0.45"/>

      <!-- Mini cards -->
      <rect x="10" y="106" width="74" height="28" rx="6" fill="#20201d" stroke="#4b432b" stroke-width="0.8"/>
      <circle cx="24" cy="120" r="2.5" fill="#22c55e"/>
      <text x="33" y="124" fill="#d7d0ba" font-family="Cascadia Mono, Consolas, monospace" font-size="9">CORE</text>

      <rect x="223" y="106" width="74" height="28" rx="6" fill="#20201d" stroke="#4b432b" stroke-width="0.8"/>
      <circle cx="237" cy="120" r="2.5" fill="#3b82f6"/>
      <text x="246" y="124" fill="#d7d0ba" font-family="Cascadia Mono, Consolas, monospace" font-size="9">BRAIN</text>

      <rect x="440" y="106" width="74" height="28" rx="6" fill="#20201d" stroke="#2b5666" stroke-width="0.8"/>
      <circle cx="454" cy="120" r="2.5" fill="#a855f7"/>
      <text x="463" y="124" fill="#d7d0ba" font-family="Cascadia Mono, Consolas, monospace" font-size="9">MCP</text>

      <!-- Progress -->
      <rect x="0" y="156" width="700" height="6" rx="3" fill="#232323"/>
      <rect x="0" y="156" width="480" height="6" rx="3" fill="url(#barFill)" opacity="0.9"/>
      <text x="0" y="180" fill="#696969" font-family="Cascadia Mono, Consolas, monospace" font-size="9">PROGRESO</text>
      <text x="700" y="180" text-anchor="end" fill="#f2c96d" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="600">75% · 6/8 modules</text>

      <!-- Module tags -->
      <g transform="translate(0, 196)" opacity="0.7">
        <rect x="0" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="33" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Graph</text>
        <rect x="72" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="105" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Plans</text>
        <rect x="144" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="177" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Ledger</text>
        <rect x="216" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="249" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Notes</text>
        <rect x="288" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="321" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Logs</text>
        <rect x="360" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="393" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Archive</text>
        <rect x="432" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b2a25" stroke-width="0.5"/>
        <text x="465" y="13" text-anchor="middle" fill="#a7a7a7" font-family="Cascadia Mono, Consolas, monospace" font-size="8">Brain</text>
        <rect x="504" y="0" width="66" height="18" rx="3" fill="#1c1b18" stroke="#2b5666" stroke-width="0.5"/>
        <text x="537" y="13" text-anchor="middle" fill="#5fd0ff" font-family="Cascadia Mono, Consolas, monospace" font-size="8">MCP</text>
      </g>
    </g>
  </g>

  <!-- ===== BOTTOM ===== -->
  <line x1="100" y1="465" x2="1500" y2="465" stroke="#f2c96d" stroke-opacity="0.12" stroke-width="0.8"/>

  <g fill="#696969" font-family="Cascadia Mono, Consolas, monospace" font-size="10" letter-spacing="1.5">
    <text x="100" y="490">v0.1.6 · CORTEX</text>
    <text x="800" y="490" text-anchor="middle">MongoDB 7 · Node 20 · VS Code · pnpm</text>
    <text x="1500" y="490" text-anchor="end">PERT / MDX / AST / TELEMETRY</text>
  </g>
</svg>
