<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cortex interface banner v2</title>
  <desc id="desc">Cortex banner inspired by the redesigned VS Code extension UI: dark command cockpit, sidebar, graph cards, table rows and amber terminal typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050608"/>
      <stop offset="0.55" stop-color="#0B0D0E"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0C86B" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#F0C86B" stop-opacity="0.65"/>
      <stop offset="0.42" stop-color="#F0C86B" stop-opacity="0.28"/>
      <stop offset="0.76" stop-color="#F0C86B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F0C86B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9AA8B2" opacity="0.07"/>
    </pattern>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','Cascadia Mono','SFMono-Regular',Consolas,monospace}
      .sans{font-family:Inter,'Segoe UI',system-ui,sans-serif}
      .muted{fill:#7E8588}.soft{fill:#AAB3B6}.gold{fill:#F0C86B}.green{fill:#20DB83}.blue{fill:#7B83FF}.red{fill:#E85D75}
      .panel{fill:#151515;stroke:#282A2C;stroke-width:1}.panel2{fill:#101112;stroke:#2A2C2E;stroke-width:1}.chip{fill:#2A2519;stroke:#856A2F;stroke-width:1}
      .hair{stroke:#2A2C2E;stroke-width:1}.goldStroke{stroke:#F0C86B;stroke-width:1}.dimStroke{stroke:#56616A;stroke-width:1}
    </style>
  </defs>

  <rect width="1280" height="420" rx="0" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="420" fill="url(#dotGrid)" opacity="0.55"/>
  <path d="M0 58H1280" stroke="#252525"/>
  <path d="M0 86H1280" stroke="url(#goldLine)"/>

  <!-- VS Code-like chrome -->
  <g class="mono" font-size="12">
    <text x="32" y="34" fill="#777">File</text><text x="72" y="34" fill="#777">Edit</text><text x="112" y="34" fill="#777">Selection</text><text x="190" y="34" fill="#777">View</text><text x="236" y="34" fill="#777">Go</text><text x="272" y="34" fill="#777">Run</text><text x="314" y="34" fill="#777">Terminal</text>
    <rect x="480" y="16" width="338" height="28" rx="7" fill="#0C0D0E" stroke="#242527"/>
    <text x="560" y="34" fill="#565D62">[Extension Development Host] Search</text>
    <circle cx="1216" cy="30" r="7" stroke="#696F72"/><circle cx="1244" cy="30" r="7" stroke="#696F72"/><circle cx="1270" cy="30" r="7" stroke="#696F72"/>
  </g>

  <!-- Sidebar -->
  <rect x="0" y="58" width="250" height="362" fill="#0B0C0D"/>
  <path d="M250 58V420" stroke="#242527"/>
  <g class="mono" font-size="11">
    <text x="20" y="82" fill="#C9D0D2">Cortex Modules</text>
    <text x="20" y="111" fill="#8B9295">⌘ Graph</text>
    <rect x="0" y="121" width="250" height="24" fill="#242424"/>
    <text x="20" y="137" fill="#E9ECEC">▤ Plans</text>
    <text x="20" y="165" fill="#8B9295">▣ Notes</text>
    <text x="20" y="190" fill="#8B9295">▥ Logs</text>
    <text x="20" y="215" fill="#8B9295">◈ Brain</text>
    <text x="20" y="240" fill="#8B9295">◇ Script Flow</text>
    <text x="20" y="265" fill="#8B9295">◌ Ledger</text>
    <text x="20" y="290" fill="#8B9295">▱ Archive</text>
    <text x="20" y="328" fill="#C9D0D2">Options</text>
    <text x="20" y="354" fill="#8B9295">Actualizar</text>
    <text x="20" y="379" fill="#8B9295">Filtros activos</text>
  </g>

  <!-- Main content shell -->
  <rect x="250" y="58" width="1030" height="362" fill="#111111"/>
  <g transform="translate(276 82)">
    <text class="mono" x="0" y="0" font-size="22" font-weight="800" letter-spacing="1.5" fill="#F0C86B">/// CORTEX</text>
    <text class="mono" x="145" y="0" font-size="22" font-weight="800" letter-spacing="1.5" fill="#F7D681">COMMAND DECK</text>
    <rect x="0" y="22" width="550" height="26" rx="5" fill="#0D0E0F" stroke="#252729"/>
    <text class="mono" x="14" y="40" font-size="11" fill="#AAB3B6">v0.1.6 · local-first knowledge cockpit · VS Code extension</text>
    <rect x="930" y="14" width="74" height="28" rx="5" fill="#111" stroke="#5D471F"/>
    <text class="mono gold" x="946" y="33" font-size="12">Actualizar</text>
  </g>

  <!-- Table block -->
  <g transform="translate(276 150)" class="mono">
    <rect x="0" y="0" width="490" height="186" rx="8" class="panel2"/>
    <text x="14" y="25" font-size="12" fill="#8A9296">Código ↕</text><text x="118" y="25" font-size="12" fill="#8A9296">Título ↕</text><text x="306" y="25" font-size="12" fill="#8A9296">Estado ↕</text><text x="390" y="25" font-size="12" fill="#8A9296">Progreso ↕</text>
    <path d="M0 38H490" class="hair"/>
    <g font-size="12">
      <rect x="12" y="53" width="88" height="18" rx="3" fill="#3B2E16"/><text x="18" y="66" fill="#F0C86B">CORTEX-REM</text><text x="118" y="66" fill="#E9ECEC">orquestador de contexto</text><circle cx="311" cy="61" r="4" class="red"/><text x="322" y="66" fill="#AAB3B6">Paused</text><text x="390" y="66" fill="#7B83FF">0/7</text>
      <path d="M12 82H478" class="hair"/>
      <rect x="12" y="96" width="96" height="18" rx="3" fill="#3B2E16"/><text x="18" y="109" fill="#F0C86B">DESIGN-ATOMS</text><text x="118" y="109" fill="#E9ECEC">sistema atómico UI</text><circle cx="311" cy="104" r="4" class="green"/><text x="322" y="109" fill="#AAB3B6">Done</text><text x="390" y="109" fill="#20DB83">9/9</text>
      <path d="M12 125H478" class="hair"/>
      <rect x="12" y="139" width="100" height="18" rx="3" fill="#3B2E16"/><text x="18" y="152" fill="#F0C86B">CORTEX-LOGS</text><text x="118" y="152" fill="#E9ECEC">visor operacional</text><circle cx="311" cy="147" r="4" class="green"/><text x="322" y="152" fill="#AAB3B6">Done</text><text x="390" y="152" fill="#20DB83">7/7</text>
      <rect x="390" y="158" width="74" height="2" fill="#20DB83"/>
    </g>
  </g>

  <!-- Graph block -->
  <g transform="translate(806 132)">
    <rect x="0" y="0" width="314" height="220" rx="8" fill="#07090B" stroke="#272A2C"/>
    <rect x="0" y="0" width="314" height="220" fill="url(#dotGrid)" opacity="0.85"/>
    <g class="mono" font-size="9">
      <rect x="35" y="88" width="82" height="44" rx="7" fill="#1A1B1C" stroke="#F0C86B"/><text x="45" y="106" fill="#E9ECEC">LR-REM-01</text><text x="45" y="122" fill="#8B9295">Context</text><circle cx="106" cy="100" r="3" fill="#F0C86B"/>
      <rect x="160" y="42" width="92" height="44" rx="7" fill="#1A1B1C" stroke="#69737A"/><text x="170" y="60" fill="#E9ECEC">LR-REM-04</text><text x="170" y="76" fill="#8B9295">Symbols</text><circle cx="242" cy="54" r="3" fill="#F0C86B"/>
      <rect x="160" y="132" width="92" height="44" rx="7" fill="#1A1B1C" stroke="#69737A"/><text x="170" y="150" fill="#E9ECEC">LR-REM-05</text><text x="170" y="166" fill="#8B9295">Ranking</text><circle cx="242" cy="144" r="3" fill="#F0C86B"/>
      <path d="M117 110C136 110 137 64 160 64" stroke="#6F7A86" fill="none"/>
      <path d="M117 110C136 110 137 154 160 154" stroke="#6F7A86" fill="none"/>
      <rect x="232" y="88" width="62" height="44" rx="7" fill="#1A1B1C" stroke="#F0C86B"/><text x="241" y="106" fill="#E9ECEC">MCP</text><text x="241" y="122" fill="#8B9295">tool</text><path d="M252 64C274 64 263 88 263 88" stroke="#6F7A86" fill="none"/><path d="M252 154C274 154 263 132 263 132" stroke="#6F7A86" fill="none"/>
    </g>
  </g>

  <!-- Detail drawer -->
  <g transform="translate(1136 104)" class="mono">
    <rect x="0" y="0" width="126" height="280" rx="8" fill="#1C1C1C" stroke="#292B2D"/>
    <text x="14" y="30" font-size="11" fill="#F0C86B">DESIGN-ATOMS</text>
    <text x="14" y="56" font-size="13" fill="#E9ECEC">Sistema de</text><text x="14" y="73" font-size="13" fill="#E9ECEC">diseño</text>
    <path d="M14 94H112" class="hair"/>
    <rect x="14" y="112" width="66" height="20" rx="10" class="chip"/><text x="24" y="126" font-size="9" fill="#F0C86B">frontend</text>
    <text x="14" y="160" font-size="10" fill="#7E8588">PROGRESO</text><text x="14" y="181" font-size="15" fill="#E9ECEC">9 / 9</text>
    <path d="M14 204H112" class="hair"/>
    <text x="14" y="230" font-size="10" fill="#7E8588">ESTADO</text><circle cx="21" cy="253" r="4" fill="#20DB83"/><text x="32" y="257" font-size="11" fill="#E9ECEC">Done</text>
  </g>

  <!-- Brand footer -->
  <g class="mono" font-size="11">
    <text x="276" y="386" fill="#6E767A">Graph · Plans · Notes · Logs · Brain · Script Flow · Ledger · Archive</text>
    <text x="1035" y="386" fill="#F0C86B">retro-futurist command interface</text>
  </g>
</svg>
