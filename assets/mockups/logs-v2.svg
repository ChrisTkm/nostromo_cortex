<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
  <style>
    .brand { fill: #f2ce7e; }
