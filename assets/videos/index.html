<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Marketplace Videos</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #111822;
        --text: #e6edf3;
        --muted: #8b949e;
        --line: #253041;
        --accent: #2eaadc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .hint {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 18px;
      }

      article {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .body {
        padding: 14px 14px 16px;
      }

      h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Cortex Marketplace Videos</h1>
          <p class="hint">Preview local de los MP4 en assets/videos.</p>
        </div>
      </header>

      <section class="grid" aria-label="Videos">
        <article>
          <video controls muted preload="metadata" src="./plan-short.mp4"></video>
          <div class="body">
            <h2>plan-short.mp4</h2>
            <p>Recorte 2s-9s, velocidad 1x.</p>
          </div>
        </article>

        <article>
          <video controls muted preload="metadata" src="./brain-short.mp4"></video>
          <div class="body">
            <h2>brain-short.mp4</h2>
            <p>Recorte 1s-15s, velocidad 1x.</p>
          </div>
        </article>

        <article>
          <video controls muted preload="metadata" src="./notas-short.mp4"></video>
          <div class="body">
            <h2>notas-short.mp4</h2>
            <p>Recorte 1s-21s, acelerado a 1.2x.</p>
          </div>
        </article>

        <article>
          <video controls muted preload="metadata" src="./script-flow-short.mp4"></video>
          <div class="body">
            <h2>script-flow-short.mp4</h2>
            <p>Recorte 5s-19s, acelerado a 1.2x.</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
